<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ντετέκτιβ Δεδομένων</title>
<meta name="description" content="Ψηφιακό παιχνίδι-εργαστήριο περιγραφικής στατιστικής: πίνακας συχνοτήτων, μέση τιμή, διάμεσος, επικρατούσα τιμή, ιστόγραμμα, εκατοστιαία σημεία, διασπορά.">
<style>
:root{
  --bg:#f3f5fb;--bg2:#e8ecf7;--card:#ffffff;--ink:#1c2240;--mut:#545c7c;--line:#d3d9ea;
  --pri:#3243c4;--pri-ink:#ffffff;--pri-soft:#e2e6fb;
  --acc:#d9820a;--acc-soft:#fff0d6;
  --ok:#11804a;--ok-soft:#dff4e8;--bad:#c2322a;--bad-soft:#fde6e3;
  --hl:#ffd54a;--bar:#5869df;--grid:#e3e7f1;
  --shadow:0 6px 20px rgba(28,35,80,.08);--r:16px;--fs:17px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10132a;--bg2:#1a1f3d;--card:#1c2145;--ink:#eef0fb;--mut:#aab1d3;--line:#353c6c;
  --pri:#8d9dff;--pri-ink:#0f1330;--pri-soft:#2a3172;--acc:#ffb547;--acc-soft:#3b2f17;
  --ok:#5fd394;--ok-soft:#143826;--bad:#ff8a80;--bad-soft:#47201d;--hl:#e0b53a;--bar:#8d9dff;--grid:#2b3160;
  --shadow:0 6px 20px rgba(0,0,0,.35);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#10132a;--bg2:#1a1f3d;--card:#1c2145;--ink:#eef0fb;--mut:#aab1d3;--line:#353c6c;
  --pri:#8d9dff;--pri-ink:#0f1330;--pri-soft:#2a3172;--acc:#ffb547;--acc-soft:#3b2f17;
  --ok:#5fd394;--ok-soft:#143826;--bad:#ff8a80;--bad-soft:#47201d;--hl:#e0b53a;--bar:#8d9dff;--grid:#2b3160;
  --shadow:0 6px 20px rgba(0,0,0,.35);color-scheme:dark;}
html.big{--fs:20px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--pri)}
h1,h2,h3{line-height:1.25}
code{font-family:ui-monospace,Consolas,"Courier New",monospace;background:var(--bg2);padding:1px 5px;border-radius:6px;font-size:.88em}
kbd{font-family:ui-monospace,Consolas,monospace;font-size:.85em;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 5px;background:var(--bg2)}
.skip{position:absolute;left:-9999px}
.skip:focus{left:16px;top:8px;z-index:100;background:var(--card);padding:8px 12px;border-radius:8px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:1060px;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.brand{font-weight:800;font-size:1.08rem;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px;margin-right:auto}
nav.main{display:flex;flex-wrap:wrap;gap:2px}
nav.main a{padding:7px 10px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:600;font-size:.92rem}
nav.main a:hover{background:var(--bg2)}
nav.main a[aria-current="page"]{background:var(--pri-soft);color:var(--pri)}
.hud{display:flex;gap:6px;align-items:center}
.pill{background:var(--pri-soft);color:var(--pri);border-radius:99px;padding:6px 12px;font-weight:800;font-size:.88rem;white-space:nowrap}
.icon{min-width:44px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:800;cursor:pointer}
.icon[aria-pressed="true"]{background:var(--pri-soft);color:var(--pri)}
main{max-width:1060px;margin:0 auto;padding:12px 16px 40px;outline:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin:14px 0;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:700;border-radius:12px;border:2px solid var(--pri);background:var(--card);color:var(--pri);padding:8px 14px;min-height:44px;cursor:pointer;text-decoration:none;line-height:1.2}
.btn.pri{background:var(--pri);color:var(--pri-ink)}
.btn.ghost{border-color:var(--line);color:var(--ink)}
.btn.acc{border-color:var(--acc);background:var(--acc);color:#1c2240}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.mini{min-height:32px;padding:2px 8px;font-size:.78rem;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:hover:not(:disabled){filter:brightness(1.06)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.mut{color:var(--mut)}.small{font-size:.86rem}
.back{display:inline-block;margin:6px 0 4px;font-weight:600;text-decoration:none}
.mhead{display:flex;gap:14px;align-items:center;margin:4px 0 6px}
.memo{font-size:3rem;line-height:1}
.kicker{font-size:.78rem;font-weight:800;color:var(--pri);text-transform:uppercase;letter-spacing:.04em}
h1{margin:0;font-size:1.7rem}
.mhead p{margin:2px 0 0}
.steps-prog{display:flex;gap:6px;margin:10px 0 0;flex-wrap:wrap}
.sp{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);color:var(--mut);font-weight:800;font-size:.85rem}
.sp.on{background:var(--pri-soft);color:var(--pri)}
.sp.ok{background:var(--ok);color:#fff}
.step h2{font-size:1.22rem;margin:0 0 12px}
.stepn{display:inline-block;background:var(--pri);color:var(--pri-ink);border-radius:8px;padding:1px 8px;font-size:.78rem;vertical-align:middle;margin-right:4px}
.next{margin-top:16px}
.story{background:var(--bg2);border-left:5px solid var(--acc);border-radius:12px;padding:10px 14px;margin:0 0 14px}
.tip{background:var(--acc-soft);border-radius:12px;padding:10px 14px;margin:12px 0}
.formula{background:var(--pri-soft);border-radius:12px;padding:10px 14px;margin:14px 0;line-height:1.75}
.hint{background:var(--acc-soft);border-radius:10px;padding:8px 12px;margin:8px 0 0}
.q{border-left:4px solid var(--line);padding:4px 0 6px 14px;margin:18px 0}
.q.correct{border-left-color:var(--ok)}
.q.revealed{border-left-color:var(--acc)}
.q-p{margin-bottom:8px}
.q-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.unit{font-weight:800}
input.num,input.txt{font:inherit;width:8.5em;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:44px}
input.txt{width:14em}
input.num:disabled{opacity:1;-webkit-text-fill-color:var(--ink)}
.fb{min-height:.5em}
.say{padding:9px 12px;border-radius:12px;margin-top:8px;border-left:4px solid var(--line);background:var(--bg2)}
.say.ok{background:var(--ok-soft);border-left-color:var(--ok)}
.say.bad{background:var(--bad-soft);border-left-color:var(--bad)}
.say.warn,.say.info{background:var(--acc-soft);border-left-color:var(--acc)}
.xpt{color:var(--pri);white-space:nowrap}
.mc{display:grid;gap:6px}
.opt{display:block;width:100%;text-align:left;font:inherit;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);cursor:pointer;min-height:44px}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default;color:var(--ink)}
.opt:disabled:not(.ok):not(.bad){opacity:.6}
.tblwrap{overflow-x:auto;max-width:100%}
.tbl{border-collapse:collapse;margin:6px 0}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 10px;text-align:center}
.tbl thead th{background:var(--pri-soft)}
.tbl tbody th{background:var(--bg2)}
.tbl tr.tot{font-weight:800}
.tbl.compact th,.tbl.compact td{padding:4px 7px;font-size:.9rem;white-space:nowrap}
.thbtns{display:flex;gap:4px;justify-content:center;margin-top:4px}
.cell{font:inherit;width:4.8em;padding:5px 6px;text-align:center;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.cell.ok{border-color:var(--ok);background:var(--ok-soft)}
.cell.bad{border-color:var(--bad);background:var(--bad-soft)}
.cell:disabled{opacity:1;-webkit-text-fill-color:var(--ink)}
td.reveal{color:var(--mut)}
td.shown{color:var(--ink);font-weight:700;animation:pop .45s}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 10px}
.chip{min-width:44px;min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:800;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--hl);border-color:var(--acc);color:#1c2240}
.tiles{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px;max-width:520px}
.tile{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;background:var(--bg2);border:2px solid var(--line);font:inherit;font-weight:800;font-size:1.02rem;color:var(--ink);user-select:none;position:relative;padding:0}
button.tile{cursor:pointer}
.tile.lit{background:var(--hl);border-color:var(--acc);color:#1c2240}
.tile.marked::after{content:"✓";position:absolute;top:-7px;right:-5px;font-size:.7rem;background:var(--ok);color:#fff;border-radius:50%;width:18px;height:18px;display:grid;place-items:center}
.tile.nope{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.tiles.sorted .tile::before{content:attr(data-pos);position:absolute;bottom:0;right:4px;font-size:.58rem;color:var(--mut);font-weight:600}
.tile.mid{background:var(--acc);border-color:var(--acc);color:#1c2240}
.tile.mid::before{color:#1c2240!important}
.counter{min-height:1.6em;margin:8px 0}
.chartbox{max-width:680px}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--mut);font-size:13px;font-family:inherit}
.chart .lbl{fill:var(--ink);font-weight:700}
.chart .axl{fill:var(--mut);font-size:12px}
.chart .axis{stroke:var(--mut);stroke-width:1.5}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .bar{fill:var(--bar)}
.chart .bar.hl{fill:var(--acc)}
.chart .bar.ok{fill:var(--ok)}
.chart .hb{stroke:var(--card);stroke-width:2}
.builder{touch-action:none;cursor:pointer}
.builder .bar:focus{outline:none;stroke:var(--acc);stroke-width:4}
.chart .poly{fill:none;stroke:var(--acc);stroke-width:3.5;stroke-linejoin:round}
.chart .pdot{fill:var(--acc)}
.chart .ogive{fill:none;stroke:var(--pri);stroke-width:3}
.chart .dot{fill:var(--pri)}
.chart .dot.mode{fill:var(--acc)}
.chart .guide{stroke:var(--acc);stroke-width:2;stroke-dasharray:6 5}
.chart .gdot{fill:var(--acc)}
.chart .cline{stroke:var(--bad);stroke-width:2.2}
.cons,.devs{transition:opacity .4s}
.devs .dpos{stroke:var(--ok);stroke-width:3}
.devs .dneg{stroke:var(--bad);stroke-width:3}
.chart .meanline{stroke:var(--acc);stroke-width:2;stroke-dasharray:5 4}
.bal{touch-action:none;cursor:ew-resize}
.bal .beam{fill:var(--ink)}
.bal .fulcrum{fill:var(--acc)}
.balmsg{font-weight:600;min-height:1.6em}
.balmsg.ok{color:var(--ok)}
.rng{display:flex;align-items:center;gap:10px;margin:8px 0;font-weight:600}
.rng span{white-space:nowrap;min-width:7.5em}
input[type=range]{width:100%;accent-color:var(--pri);min-height:32px}
.rngs{max-width:680px}
.readout{font-weight:600}
.lab{touch-action:manipulation;cursor:pointer}
.lab .curcol{fill:var(--pri-soft)}
.lab .medline{stroke:var(--ok);stroke-width:2;stroke-dasharray:4 4}
.lab .medlbl{fill:var(--ok);font-weight:800}
.lab .meantri{fill:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin:10px 0}
.stat{background:var(--bg2);border-radius:12px;padding:8px 10px}
.stat span{display:block;font-size:.78rem;color:var(--mut)}
.stat b{font-size:1.2rem}
.ss{font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:.84rem}
.sscols{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,2fr);gap:12px;align-items:start}
.ss table{border-collapse:collapse;width:100%}
.ss td,.ss th{border:1px solid var(--line);padding:4px 7px;text-align:left;vertical-align:top}
.ss th{background:var(--bg2);color:var(--mut);font-weight:600;text-align:center}
.ss code{background:none;padding:0;color:var(--pri);word-break:break-all}
.ss .ftw{overflow-x:auto;max-width:100%}
.ss .val{font-weight:700;white-space:nowrap}
.chl{list-style:none;padding:0;margin:8px 0}
.chl li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
.chl .st{font-size:1.2rem;line-height:1.2}
textarea{font:inherit;width:100%;padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;align-items:center}
.hero h1{font-size:2.1rem;margin:2px 0 6px}
.nick{display:flex;flex-direction:column;gap:4px;margin-top:10px;font-weight:600;font-size:.92rem}
.rankbox{background:var(--bg2);border-radius:14px;padding:14px;text-align:center}
.rk{font-weight:800;color:var(--pri)}
.xpbig{font-size:2rem;font-weight:800}
.xpbar{height:12px;background:var(--card);border-radius:99px;overflow:hidden;margin:6px 0}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--acc))}
h2.sec{font-size:1.25rem;margin:22px 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.grid .card{margin:0}
.mcard{display:flex;flex-direction:column;gap:6px}
.mcard h3{margin:2px 0 0;font-size:1.1rem}
.mcard p{margin:0}
.mcard .btn{margin-top:auto;align-self:flex-start}
.mcard .em{font-size:2.3rem;line-height:1}
.tag{display:inline-block;font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--pri-soft);color:var(--pri)}
.tag.ch{background:var(--acc-soft);color:var(--ink)}
.stars{color:var(--acc);font-size:1.25rem;letter-spacing:2px;min-height:1.5em}
.badges{display:flex;flex-wrap:wrap;gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;width:104px;text-align:center;font-size:.78rem;gap:4px}
.badge .ic{font-size:1.9rem;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--acc-soft);border:2px solid var(--acc)}
.badge.off{opacity:.45}
.badge.off .ic{filter:grayscale(1);border-color:var(--line);background:var(--bg2)}
.done{text-align:center}
.big-stars{font-size:2.6rem;color:var(--acc);letter-spacing:6px}
.rep td,.rep th{text-align:left}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,calc(100% + 40px));opacity:0;visibility:hidden;background:var(--ink);color:var(--card);padding:10px 18px;border-radius:99px;font-weight:700;box-shadow:var(--shadow);transition:transform .3s,opacity .3s,visibility .3s;z-index:50;max-width:calc(100vw - 32px);text-align:center}
#toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
#cf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
#cf span{position:absolute;top:-40px;font-size:26px;animation:fall 2.2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.guide-sec h2{font-size:1.2rem;margin-top:0}
.guide-sec li{margin:4px 0}
@media (max-width:760px){
  .two,.hero,.sscols{grid-template-columns:minmax(0,1fr)}
  nav.main{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto}
  .card{padding:14px}
  h1{font-size:1.45rem}.hero h1{font-size:1.7rem}
  .memo{font-size:2.4rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  header.top,.noprint,button,.back,#toast,#cf{display:none!important}
  body{background:#fff;color:#000}
  .card{box-shadow:none;border:1px solid #999;break-inside:avoid}
}
</style>

<script>

/* =====================================================================
   Ντετέκτιβ Δεδομένων — ψηφιακό υλικό περιγραφικής στατιστικής (CS148)

   Πιθανότητες–Στατιστική (Τμήμα Πληροφορικής, Πανεπιστήμιο Δυτ. Μακεδονίας).

const AUTHOR = 'Ιωάννης Μιχαδάσης';
const KEY = 'ntetektiv-dedomenon-v1';
const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

const $ = (s, r = document) => r.querySelector(s);
const sum = a => a.reduce((s, x) => s + x, 0);
const mean = a => a.length ? sum(a) / a.length : NaN;
function cumsum(a) { let s = 0; return a.map(x => (s += x)); }
function median(a) { const s = [...a].sort((x, y) => x - y), n = s.length; if (!n) return NaN; return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2; }
function modes(a) {
  if (!a.length) return [];
  const m = new Map(); a.forEach(x => m.set(x, (m.get(x) || 0) + 1));
  const fr = [...m.values()], mx = Math.max(...fr);
  if (m.size > 1 && fr.every(v => v === mx)) return [];
  return [...m.keys()].filter(k => m.get(k) === mx).sort((x, y) => x - y);
}
function excelMode(a) { const m = new Map(); let best = null, bf = 1; a.forEach(x => { const c = (m.get(x) || 0) + 1; m.set(x, c); if (c > bf) { bf = c; best = x; } }); if (best === null) return null; for (const x of a) if (m.get(x) === bf) return x; return best; }
